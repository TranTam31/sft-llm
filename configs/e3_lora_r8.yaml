# PLAN 5.1-5.2 E3 (LoRA) at r = 8 (seed 0 only); everything else as configs/e3_lora_r64.yaml.
base: configs/e3_lora_r64.yaml
run_name: e3_lora_r8_s{seed}
lora:
  r: 8
  alpha: 16                    # 2r
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
output_dir: results/runs/e3_lora_r8_s{seed}
hub_model_id: null             # e.g. <username>/smollm2-360m-e3-lora-r8-s{seed}; pass --hub-model-id on Colab
